<!doctype html>
<html lang="en">
  <head>
    <title>Chatbot</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .entire-container {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 5px;
        background-color: rgb(222, 222, 222);
      }
      button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Timer1({ count, setCount }) {
        function clicked() {
          setCount((count) => count + 1);
        }

        return (
          <>
            <button onClick={clicked}>
              Clicked {count} {count === 1 ? "time" : "times"}
            </button>
          </>
        );
      }

      function AutoClick({
        autoCount,
        setAutoCount,
        setIntervalId,
        intervalId,
      }) {
        function autoclicked() {
          if (intervalId !== null) return;

          const id = setInterval(() => {
            setAutoCount((count) => count + 1);
          }, 1000);

          setIntervalId(id);
        }

        return (
          <>
            <button onClick={autoclicked}>Auto Click</button>
          </>
        );
      }

      function Reset({ setCount, setAutoCount, intervalId, setIntervalId }) {
        function reset() {
          setCount(0);
          setAutoCount(0);

          if (intervalId !== null) {
            clearInterval(intervalId);
            setIntervalId(null);
          }
        }

        return (
          <>
            <button onClick={reset}>Reset</button>
          </>
        );
      }

      function App() {
        const [count, setCount] = React.useState(0);
        const [autoCount, setAutoCount] = React.useState(0);
        const [intervalId, setIntervalId] = React.useState(null);

        return (
          <div className="entire-container">
            <Timer1 count={count} setCount={setCount} />
            <Reset
              setCount={setCount}
              setAutoCount={setAutoCount}
              intervalId={intervalId}
              setIntervalId={setIntervalId}
            />
            <AutoClick
              autoCount={autoCount}
              setAutoCount={setAutoCount}
              intervalId={intervalId}
              setIntervalId={setIntervalId}
            />
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
